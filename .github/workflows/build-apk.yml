name: Build Quest 2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Godot Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot Engine
        run: |
          GODOT_VERSION=4.3-stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot4
          
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -keysize 2048 -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Android Build Template
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build/
          echo "4.3.stable" > android/.build_version

      - name: Run Export
        run: |
          mkdir -p build
          godot4 --headless --export-debug "Quest Android" build/app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest2-apk
          path: build/*.apk
